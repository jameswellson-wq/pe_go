name: Build pedumper

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4
        with:


      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true               # 自动缓存 Go modules，加速后续构建

      - name: 下载依赖
        run: go mod download

      - name: 运行测试
        run: go test ./...

      - name: 编译 pedumper (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          go build -v \
            -ldflags="-s -w" \
            -o pedumper \
            ./cmd/pedumper/

      - name: 编译 pedumper (Windows)
        if: runner.os == 'Windows'
        run: |
          go build -v `
            -ldflags="-s -w" `
            -o pedumper.exe `
            ./cmd/pedumper/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pedumper-${{ matrix.os }}
          path: |
            pedumper
            pedumper.exe
          if-no-files-found: ignore
          retention-days: 7
