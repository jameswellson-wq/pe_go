name: Build pedumper (All Platforms)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download dependencies
        run: |
          go mod download 2>&1 | tee -a build.log
          echo "--- mod download exit code: $?" >> build.log

      - name: Build all platforms
        run: |
          echo "===== BUILD START: $(date -u) =====" >> build.log
          echo "Go version: $(go version)"           >> build.log
          echo ""                                    >> build.log

          mkdir -p dist

          targets=(
            "windows amd64 .exe"
            "windows arm64 .exe"
            "linux   amd64 ''"
            "linux   arm64 ''"
            "linux   386   ''"
            "darwin  amd64 ''"
            "darwin  arm64 ''"
          )

          for target in "${targets[@]}"; do
            read -r OS ARCH EXT <<< "$target"
            EXT="${EXT//\'}"

            OUTPUT="dist/pedumper-${OS}-${ARCH}${EXT}"

            echo "----- [$(date -u +%T)] ${OS}/${ARCH} -----" >> build.log

            GOOS=$OS GOARCH=$ARCH \
            go build -v \
              -ldflags="-s -w" \
              -o "$OUTPUT" \
              ./cmd/ 2>&1 | tee -a build.log

            CODE=${PIPESTATUS[0]}
            if [ $CODE -eq 0 ]; then
              SIZE=$(ls -lh "$OUTPUT" | awk '{print $5}')
              echo "✅ OK  size=${SIZE}  output=${OUTPUT}" >> build.log
            else
              echo "❌ FAILED  exit=${CODE}" >> build.log
            fi
            echo "" >> build.log
          done

          echo "===== BUILD END: $(date -u) =====" >> build.log
          echo ""                                  >> build.log
          echo "--- dist/ contents ---"            >> build.log
          ls -lh dist/                             >> build.log

      - name: Show log
        if: always()
        run: cat build.log

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: pedumper-all-platforms
          path: dist/
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30
