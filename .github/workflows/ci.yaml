name: Build pedumper

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.23']
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # 先列出目录结构，方便排查问题
      - name: Show repo structure
        run: |
          find . -type f -name "*.go" | grep -v "_test.go" | head -30

      # ✅ 修正路径：用 ./cmd/ 而不是 ./cmd/pedumper/
      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: go build -v -ldflags="-s -w" -o pedumper ./cmd/

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: go build -v -ldflags="-s -w" -o pedumper.exe ./cmd/

      - name: Test
        run: go test -v -count=1 ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pedumper-go${{ matrix.go }}-${{ matrix.os }}
          path: |
            pedumper
            pedumper.exe
          if-no-files-found: ignore
          retention-days: 7
