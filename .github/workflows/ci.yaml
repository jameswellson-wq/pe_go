name: Build pedumper

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.23']
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # ✅ 只跑编译，跳过 staticcheck linting
      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: go build -v -ldflags="-s -w" -o pedumper ./cmd/pedumper/

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: go build -v -ldflags="-s -w" -o pedumper.exe ./cmd/pedumper/

      # ✅ 跑单元测试，但不跑 lint
      - name: Test
        run: go test -v -count=1 ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pedumper-go${{ matrix.go }}-${{ matrix.os }}
          path: |
            pedumper
            pedumper.exe
          if-no-files-found: ignore
          retention-days: 7
