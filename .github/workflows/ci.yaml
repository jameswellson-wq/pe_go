name: Build pedumper (Windows exe)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build Windows exe
        run: |
          GOOS=windows GOARCH=amd64 \
          go build -v \
            -ldflags="-s -w" \
            -o pedumper.exe \
            ./cmd/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pedumper-windows-amd64
          path: pedumper.exe
          retention-days: 30
